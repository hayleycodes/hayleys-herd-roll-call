name: Deploy pig-recognizer

on:
  push:
    branches: [main]
    paths:
      - "services/pig-recognizer/**"
      - ".github/workflows/deploy-pig-recognizer.yml"

# Cancel an in-flight deploy if a newer commit lands.
concurrency:
  group: deploy-pig-recognizer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: services/pig-recognizer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

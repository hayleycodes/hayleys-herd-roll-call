# fly.toml for the pig-recognizer worker.
# Deploy from this directory:  fly deploy
#
# It's a background worker (no inbound HTTP), so there are no [http_service]
# or [[services]] blocks — Fly just keeps the process running.

app = "hayleys-herd-pig-recognizer"
primary_region = "syd"   # close to the cameras (Australia)

[build]

[env]
  INTERVAL_SECONDS = "600"
  TZ = "Australia/Perth"
  DAYLIGHT_START_HOUR = "7"
  DAYLIGHT_END_HOUR = "7"
  CROP_BUCKET = "pig_photos"
  CROP_PREFIX = "recognition"
  DETECTOR_MODEL = "yolov8s-worldv2.pt"

# One always-on Machine. Bump memory to 2048 if torch OOMs at 1024.
# Secrets (NOT set here): fly secrets set SUPABASE_URL=... \
#   SUPABASE_SERVICE_ROLE_KEY=... PIG_CAM_RTSP=...
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  cpus = 1

[[vm.processes]]
  worker = "python main.py"
